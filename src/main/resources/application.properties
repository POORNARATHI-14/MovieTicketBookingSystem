spring.application.name=movie-ticket-booking
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------- MySQL
# Credentials come from environment variables - nothing secret is stored in this file.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:movie_ticket_booking_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
# READ COMMITTED avoids most gap-lock deadlocks; all seat/booking transitions use guarded UPDATEs so they do not rely on repeatable reads
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# The schema is owned by Flyway (src/main/resources/db/migration). Hibernate never changes it.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.problemdetails.enabled=false

# ---------------------------------------------------------------- Application settings
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# An ADMIN user is created at start-up only when ADMIN_PASSWORD is provided.
app.admin.name=Administrator
app.admin.email=${ADMIN_EMAIL:admin@movieticket.local}
app.admin.password=${ADMIN_PASSWORD:}

app.seat-lock.duration-minutes=${SEAT_LOCK_MINUTES:5}
app.seat-lock.expiry-scan-ms=5000

app.scheduling.enabled=true
app.saga.recovery-scan-ms=30000
app.saga.recovery-after-seconds=60
app.idempotency.wait-ms=3000

# ---- Payment SIMULATOR (no real money, no real gateway) ----
# Methods: TEST_SUCCESS, TEST_DECLINED, TEST_TIMEOUT, TEST_CAPTURE_THEN_FAIL, TEST_RANDOM
app.payment.simulator.default-method=${PAYMENT_DEFAULT_METHOD:TEST_SUCCESS}
app.payment.simulator.success-rate=0.8
app.payment.simulator.latency-ms=300
app.payment.simulator.fault-injection-enabled=true

# ---- RabbitMQ (optional) ----
app.rabbitmq.enabled=${RABBITMQ_ENABLED:false}
app.rabbitmq.exchange=movieticket.events
app.rabbitmq.queue=movieticket.events.audit
app.outbox.poll-ms=2000
app.outbox.batch-size=50

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=simple
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_ENABLED:false}

logging.level.com.movieticket=INFO
