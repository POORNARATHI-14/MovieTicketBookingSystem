# Integration tests run against REAL MySQL (no H2). Use a separate database from the application.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${TEST_DB_NAME:movie_ticket_booking_test_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Background jobs are triggered explicitly by the tests so they stay deterministic.
app.scheduling.enabled=false
app.payment.simulator.latency-ms=0
app.idempotency.wait-ms=5000
app.rabbitmq.enabled=false
app.admin.password=
logging.level.com.movieticket=WARN
