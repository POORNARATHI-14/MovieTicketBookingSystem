<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register - CineBook</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-page="register">
<header id="nav"></header>
<main><div class="container">
<div class="card auth-box"><h1>Create your account</h1><p class="muted">It takes less than a minute.</p>
<div id="msg"></div>
<form id="regForm" novalidate><label for="name">Full name</label><input id="name" autocomplete="name" maxlength="100" required>
<label for="email">Email</label><input id="email" type="email" autocomplete="username" maxlength="150" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="new-password" required>
<div class="muted small" style="margin-top:4px">Use a strong password (the server enforces its password rules and will tell you what is missing).</div>
<button class="btn primary block" style="margin-top:20px" id="submit">Register</button></form>
<p class="center muted small" style="margin-top:16px">Already registered? <a href="login.html">Log in</a></p></div>
</div></main>
<footer id="footer"></footer>
<div id="toasts" aria-live="polite"></div>
<script src="js/core.js"></script>
<script src="js/pages_auth.js"></script>
</body>
</html>
